<title>Ahmise</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Itim&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/* Layout: persistent left sidebar (nav, pinned and recent chats) + one main pane that swaps between Chat, Create an image, Search, Library, Projects, Export, Scheduled, Plugins (Notes, Calendar) and Settings with its sub pages. Below 820px the sidebar becomes a drawer. */
:root{
  --bg:#fdfbfd; --surface:#ffffff; --sidebar:#f8f4f9; --ink:#1d1722; --muted:#81788a; --line:#ece5ee;
  --accent:#e8468f; --accent-ink:#ffffff; --accent-soft:#fde6f0; --pill:#e7f0ff; --pill-ink:#1769d1; --chip:#f1ebf3; --shadow:0 6px 24px rgba(60,20,70,.08);
  --code-bg:#241d2b; --code-ink:#f2ecf6; --err:#c0392b; --err-soft:#fdecea;
  --display:'Itim','Segoe Print','Comic Sans MS',system-ui,sans-serif;
  --body:'Patrick Hand','Segoe Print','Comic Sans MS',system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15111a; --surface:#1f1925; --sidebar:#1a1520; --ink:#f4eff7; --muted:#a398ad; --line:#322a3a;
  --accent-soft:#3b1b2c; --pill:#16253d; --pill-ink:#7db4ff; --chip:#2a2231; --shadow:0 6px 24px rgba(0,0,0,.4);
  --code-bg:#120e17; --err:#ff8a7a; --err-soft:#3a1c19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15111a; --surface:#1f1925; --sidebar:#1a1520; --ink:#f4eff7; --muted:#a398ad; --line:#322a3a;
  --accent-soft:#3b1b2c; --pill:#16253d; --pill-ink:#7db4ff; --chip:#2a2231; --shadow:0 6px 24px rgba(0,0,0,.4);
  --code-bg:#120e17; --err:#ff8a7a; --err-soft:#3a1c19; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.4;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
input,textarea{font:inherit;color:var(--ink)}

.app{display:flex;height:100%;min-width:0}
.side{width:280px;flex:none;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 16px 16px;gap:8px;min-height:0;z-index:20;overflow-y:auto}
.brand{display:flex;align-items:center;justify-content:space-between;padding:0 4px 4px}
.brand b{font-family:var(--display);font-weight:400;font-size:30px;letter-spacing:.2px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:15px}
.round{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;box-shadow:0 1px 4px rgba(60,20,70,.1);flex:none}
.round:hover{background:var(--chip)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button,.row{display:flex;align-items:center;gap:14px;padding:9px 10px;border-radius:14px;text-align:left;width:100%;font-family:var(--display);font-size:19px;min-width:0}
.nav button:hover,.row:hover{background:var(--chip)}
.nav button[aria-current="page"],.row[aria-current="true"]{background:var(--accent-soft)}
.label{font-family:var(--display);font-size:17px;padding:12px 10px 2px;color:var(--ink)}
.list{display:flex;flex-direction:column;overflow:auto;min-height:0}
.list.grow{flex:0 0 auto;overflow:visible;min-height:120px}
.row{font-family:var(--body);font-size:18px}
.row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.none{color:var(--muted);padding:6px 10px;font-size:17px}
.side-foot{display:flex;align-items:center;justify-content:space-between;padding:8px 0 4px;margin-top:auto;position:sticky;bottom:0;background:var(--sidebar)}
.btn-chat{display:flex;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:20px;padding:13px 22px;border-radius:999px;box-shadow:var(--shadow)}
.avatar{width:44px;height:44px;border-radius:50%;background:conic-gradient(from 200deg,#e8468f,#8b5cf6,#38bdf8,#e8468f);display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:19px;box-shadow:0 1px 4px rgba(60,20,70,.2);flex:none}

.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.top{display:flex;align-items:center;gap:12px;padding:16px max(16px,env(safe-area-inset-right,0px)) 8px 16px;min-height:76px}
.top .title{font-family:var(--display);font-size:22px;flex:1;text-align:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .spacer{flex:1}
.menu{display:none}
.model-pill{display:flex;align-items:center;gap:8px;background:var(--pill);color:var(--pill-ink);font-family:var(--display);font-size:19px;padding:10px 16px 10px 18px;border-radius:999px;height:44px}
.model-pill svg.i{width:18px;height:18px}
.view{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.wrap{width:100%;max-width:960px;margin:0 auto;padding:12px 24px 120px}
.wrap.pad{padding-bottom:40px}
.narrow{max-width:640px}

/* chat */
.chat{display:flex;flex-direction:column;flex:1;min-height:0}
.msgs{flex:1;overflow:auto;padding:8px 24px 16px;min-height:0}
.msgs .inner{width:100%;max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.bubble{max-width:88%;padding:12px 16px;border-radius:20px;overflow-wrap:anywhere}
.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px;white-space:pre-wrap}
.fchip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);border-radius:999px;padding:3px 12px 3px 8px;font-size:15px;margin-bottom:6px;max-width:100%}
.fchip svg.i{width:16px;height:16px}
.botw{align-self:flex-start;max-width:100%;width:100%;display:flex;flex-direction:column;gap:4px}
.bot{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px;align-self:flex-start;max-width:min(100%,720px)}
.bot p{margin:0 0 .7em}.bot p:last-child{margin-bottom:0}
.bot ul,.bot ol{margin:.2em 0 .7em;padding-left:1.4em}.bot li{margin:.15em 0}
.bot h4{font-family:var(--display);font-weight:400;font-size:1.15em;margin:.6em 0 .3em}
.bot code{font-family:var(--mono);font-size:.86em;background:var(--chip);padding:.1em .38em;border-radius:6px}
.code{background:var(--code-bg);color:var(--code-ink);border-radius:14px;margin:.4em 0 .8em;overflow:hidden}
.code .ch{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;font-size:15px;color:#b9aec4;border-bottom:1px solid rgba(255,255,255,.08)}
.code .ch button{padding:4px 12px;border-radius:999px;color:#e9e1f0}
.code .ch button:hover{background:rgba(255,255,255,.1)}
.code pre{margin:0;padding:12px 14px;overflow-x:auto;font-family:var(--mono);font-size:14px;line-height:1.5}
.acts{display:flex;gap:2px;padding-left:6px}
.acts button{display:flex;align-items:center;gap:6px;color:var(--muted);padding:6px 10px;border-radius:999px;font-size:16px}
.acts button:hover{background:var(--chip);color:var(--ink)}
.acts svg.i{width:18px;height:18px}
.typing{display:inline-flex;gap:5px;padding:6px 2px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:bob 1.1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.err{background:var(--err-soft);color:var(--err);border:1px solid var(--err);align-self:flex-start;max-width:min(100%,720px)}
.note{color:var(--muted);font-size:15px;padding-left:6px}
.gen{align-self:flex-start;max-width:min(100%,520px);display:flex;flex-direction:column;gap:4px}
.gen video{width:100%;border-radius:22px;background:#000;display:block}
.gen img{width:100%;height:auto;aspect-ratio:4/3;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:block}
.hello{font-family:var(--display);font-size:clamp(28px,4vw,40px);text-align:center;padding:10vh 0 0;text-wrap:balance}
.hello small{display:block;font-family:var(--body);font-size:19px;color:var(--muted);margin-top:8px}
.sugs{width:100%;max-width:780px;margin:0 auto;padding:0 24px 8px;display:flex;flex-direction:column;gap:2px}
.sugs button{display:flex;align-items:center;gap:16px;padding:11px 10px;border-radius:14px;color:var(--muted);font-size:20px;font-family:var(--display);text-align:left}
.sugs button:hover{background:var(--chip);color:var(--ink)}
.composer-wrap{padding:8px max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) 16px}
.cbox{width:100%;max-width:1000px;margin:0 auto;position:relative}
.composer{width:100%;background:var(--surface);border-radius:32px;box-shadow:var(--shadow);border:1px solid var(--line);padding:10px 12px;display:flex;align-items:flex-end;gap:8px}
.composer textarea{flex:1;min-width:0;border:0;background:none;font-size:20px;padding:10px 6px;resize:none;max-height:180px;line-height:1.35;outline:none}
.composer textarea::placeholder{color:var(--muted)}
.attrow{display:flex;padding:0 8px 8px}
.attrow:empty{display:none}
.attchip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 14px;max-width:100%;box-shadow:var(--shadow)}
.attchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attchip button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.attchip button:hover{background:var(--chip)}
.pmenu{position:absolute;left:0;bottom:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:6px;z-index:30;min-width:240px}
.pmenu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border-radius:14px;font-family:var(--display);font-size:19px}
.pmenu button:hover{background:var(--chip)}
.fine{text-align:center;color:var(--muted);font-size:14px;padding:6px 0 0}
.ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.ic:hover{background:var(--chip)}
.send{background:var(--accent);color:var(--accent-ink)}
.send:hover{background:var(--accent);filter:brightness(1.05)}
.send.idle{opacity:.45}
.ic.rec{background:var(--err-soft);color:var(--err);animation:bob 1s infinite ease-in-out}
.stack{display:flex;flex-direction:column;gap:12px;width:100%;max-width:560px}
.btn.block{width:100%}
.remote-pts{display:flex;flex-direction:column;gap:20px;text-align:left;max-width:520px;margin:18px 0 12px}
.remote-pts div{display:flex;gap:16px;align-items:flex-start;color:var(--muted)}
.remote-pts svg{margin-top:3px}
.composer.create{flex-direction:column;align-items:stretch;gap:2px;padding:18px 20px 12px}
.composer.create .tag{font-family:var(--display);color:var(--accent);font-size:20px}
.composer.create .bar{display:flex;align-items:center;gap:10px}
.composer.create input{flex:1;min-width:0;border:0;background:none;font-size:20px;padding:10px 6px;outline:none}
.composer.create input::placeholder{color:var(--muted)}

/* image gallery */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding-bottom:12px}
.tile{position:relative;border-radius:26px;overflow:hidden;aspect-ratio:4/5;background:var(--chip);text-align:left;display:block;width:100%;transition:transform .15s,box-shadow .15s}
.tile svg.art{position:absolute;inset:0;width:100%;height:100%}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:44px 18px 16px;color:#fff;font-family:var(--display);font-size:20px;background:linear-gradient(transparent,rgba(20,10,30,.62))}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}

/* cards and lists */
.hero{text-align:center;padding:24px 0 22px}
.hero h2{font-size:clamp(30px,4vw,42px)}
.hero p{margin:8px 0 0;color:var(--muted);font-size:19px}
.cards{display:flex;flex-direction:column;gap:12px}
.card{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:16px 20px;text-align:left;width:100%;flex-wrap:wrap}
button.card:hover{border-color:var(--accent)}
.card.sel{border-color:var(--accent);background:var(--accent-soft)}
.card .em{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);display:grid;place-items:center;flex:none;color:var(--accent)}
.card .tx{flex:1;min-width:140px}
.card .tx b{display:block;font-family:var(--display);font-weight:400;font-size:20px}
.card .tx span{color:var(--muted);font-size:17px}
.sw{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{left:23px}
.sec{font-family:var(--display);font-size:20px;color:var(--muted);padding:18px 4px 8px}
.time{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;font-size:17px}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:14px 16px;font-size:19px;line-height:1.4;resize:vertical;min-height:120px;outline:none}
.field:focus{border-color:var(--accent)}
.help{color:var(--muted);font-size:16px;padding:6px 6px 0}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px 12px;border-radius:999px;font-family:var(--display);font-size:18px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(60,20,70,.12)}
.setrow{display:flex;align-items:center;gap:16px;padding:16px 20px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .tx{flex:1;min-width:0}
.setrow .tx b{display:block;font-family:var(--display);font-weight:400;font-size:19px}
.setrow .tx span{color:var(--muted);font-size:16px}
.inline-form{display:flex;gap:8px;width:100%;margin-top:8px}
.inline-form input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:12px 18px;font-size:19px;outline:none}
.inline-form input:focus{border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 18px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:32px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{color:var(--muted);font-size:16px}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding:8px 4px 0;border-bottom:1px solid var(--line)}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.bars i{display:block;width:100%;max-width:44px;background:var(--accent);border-radius:10px 10px 4px 4px;min-height:3px}
.bars em{font-style:normal;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.bars .z i{background:var(--line)}
.days{display:flex;gap:10px;padding:6px 4px 0}
.days span{flex:1;text-align:center;color:var(--muted);font-size:16px}
.days span.t{color:var(--ink);font-family:var(--display)}
.meter{height:12px;background:var(--chip);border-radius:999px;overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
.notebox{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 18px;white-space:pre-wrap;overflow-wrap:anywhere}
.dayh{font-family:var(--display);font-size:19px;padding:14px 4px 6px}
.dayh.t{color:var(--accent)}
.trow{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px 12px 10px 18px;margin-bottom:8px}
.trow time{font-variant-numeric:tabular-nums;color:var(--muted);min-width:56px}
.trow b{flex:1;font-family:var(--display);font-weight:400;font-size:19px;min-width:0}

/* plugins */
.inst{display:flex;gap:14px;flex-wrap:wrap;padding:4px 0 8px}
.appico{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:24px;flex:none}
button.appico:hover{filter:brightness(1.08)}
.plug{display:flex;align-items:center;gap:16px;padding:12px 4px}
.plug .appico{border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.plug .tx{flex:1;min-width:0}
.plug .tx b{display:block;font-family:var(--display);font-weight:400;font-size:20px}
.plug .tx span{color:var(--muted);font-size:17px}

.search-bar{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;padding:6px 12px 6px 20px;max-width:960px;margin:0 auto}
.search-bar input{flex:1;min-width:0;border:0;background:none;font-size:20px;padding:12px 0;outline:none}
.search-bar>svg{color:var(--muted)}
.search-top{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 20px;margin-bottom:14px}
.search-top input{flex:1;min-width:0;border:0;background:none;font-size:20px;padding:12px 0;outline:none}
.search-top svg{color:var(--muted)}

/* empty / centered */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px 24px 120px}
.center .big{width:70px;height:70px;border-radius:20px;background:var(--chip);display:grid;place-items:center}
.center h3{font-size:24px}
.center p{margin:0;color:var(--muted);max-width:420px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-size:20px;padding:14px 32px;border-radius:999px}
.btn.sm{font-size:17px;padding:9px 20px}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.line{border:1px solid var(--line);background:var(--surface)}
.btn.danger{border:1px solid var(--err);color:var(--err)}
.btns{display:flex;gap:10px;flex-wrap:wrap;padding-top:12px}

/* library */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.tabs button{font-family:var(--display);font-size:19px;padding:10px 20px;border-radius:999px;color:var(--muted);flex:none}
.tabs button[aria-selected="true"]{background:var(--chip);color:var(--ink)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.file{background:var(--surface);border:1px solid var(--line);border-radius:20px;aspect-ratio:1/1;position:relative;overflow:hidden;min-width:0}
.file:hover{border-color:var(--accent)}
.fmain{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;text-align:left;padding:14px 16px}
.fmain .nm{font-family:var(--display);font-size:18px;overflow-wrap:anywhere;padding-right:30px}
.fmain .ty{display:flex;align-items:center;gap:6px;color:var(--accent)}
.file img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.star{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.85);color:#6a5b75}
.star[aria-pressed="true"]{color:#e8a200}
.star[aria-pressed="true"] svg.i{fill:#e8a200}
.star svg.i{width:20px;height:20px}
.viewer{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;overflow:auto;max-height:55vh}

.group{background:var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden;margin-bottom:20px}
.set{display:flex;align-items:center;gap:16px;padding:16px 20px;border-bottom:1px solid var(--line);width:100%;text-align:left;font-family:var(--display);font-size:19px}
.set:last-child{border-bottom:0}

.set .v{margin-left:auto;color:var(--muted);font-family:var(--body);padding-left:12px;white-space:nowrap}
.swatches{display:flex;gap:10px;margin-left:auto}
.swatches button{width:30px;height:30px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}

.name-in{border:0;background:none;text-align:right;margin-left:auto;min-width:0;width:50%;outline:none}

.pop.left{right:auto;left:max(16px,calc(env(safe-area-inset-left,0px) + 16px))}

.pop button small{display:block;font-family:var(--body);font-size:15px;color:var(--muted)}
.pop button:hover{background:var(--chip)}
.pop .danger{color:var(--err)}
.pop [aria-checked="true"]{background:var(--accent-soft)}
.rem{position:fixed;top:max(12px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:24px;padding:12px 14px 12px 22px;display:flex;align-items:center;gap:12px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px);font-family:var(--display);font-size:18px}

.toast.on{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}

/* Standalone mode: when the page is not inside Claude, talk to the Ahmise server instead. */
(function(){
  if(window.claude&&window.claude.use)return;
  window.AHMISE_SERVER=true;
  function key(){var k='';try{k=localStorage.getItem('ahmiseKey')||''}catch(e){}
    if(!k){k=(prompt('Enter your Ahmise access code')||'').trim();if(k){try{localStorage.setItem('ahmiseKey',k)}catch(e){}}}return k}
  function fail(code){var e=new Error(code);e.code=code;return e}
  function sample(input,o){
    o=o||{};
    var k=key();if(!k)return Promise.reject(fail('not_granted'));
    var isImg=typeof input==='string'&&/^Draw an original illustration/.test(input);
    return fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json','x-ahmise-key':k},signal:o.signal,
      body:JSON.stringify({input:input,modelTier:o.modelTier,tools:!isImg})}).then(function(res){
      if(res.status===401){try{localStorage.removeItem('ahmiseKey')}catch(e){}throw fail('session_expired')}
      if(!res.ok||!res.body)throw fail('upstream_error');
      var rd=res.body.getReader(),dec=new TextDecoder(),buf='',text='',err=null;
      function pump(){return rd.read().then(function(r){
        if(r.done)return;
        buf+=dec.decode(r.value,{stream:true});var parts=buf.split('\n\n');buf=parts.pop();
        parts.forEach(function(p){if(p.indexOf('data: ')!==0)return;var j;try{j=JSON.parse(p.slice(6))}catch(e){return}
          if(j.delta){text+=j.delta;if(o.onText)o.onText({text:text,delta:j.delta})}
          if(j.error)err=j.error});
        return pump()})}
      return pump().then(function(){if(err&&!text.trim())throw fail(err);return {text:text,truncated:false}})
    },function(e){if(e&&e.name==='AbortError')throw fail('cancelled');if(e&&e.code)throw e;throw fail('upstream_error')})
  }
  function save(r){
    return new Promise(function(ok){
      var b=r.data instanceof Blob?r.data:new Blob([r.data]),a=document.createElement('a');
      a.href=URL.createObjectURL(b);a.download=r.filename;document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(a.href)},4000);ok({status:'saved'})})
  }
  window.claude={use:function(n){return Promise.resolve(n==='sample'?sample:n==='downloads'?{save:save}:null)}};
})();
</script>

  function rules(c){
    var s=S.set,tone={friendly:'Be warm and conversational.',concise:'Keep answers short and to the point.',detailed:'Give thorough, well-organised answers with examples.'}[s.tone]||'';
    var r='You are the assistant inside Ahmise, a friendly chat app. '+tone+' Match the length of your answer to the question. Write plain text with light markdown only: **bold**, - bullet lists, numbered lists, `inline code` and fenced code blocks. You have tools: web search, reading a web page link, the current date and time, and an exact calculator. Use them whenever they help, and do not claim you cannot browse. Your name is Ahmise. If someone asks who made you, answer as Ahmise: say you are Ahmise, an assistant app made by Shehashi. If asked who made you, say Shehashi made you. Never say you are Claude or name the AI model or company behind you, and do not volunteer how you work inside. Only if the person sincerely and directly asks whether you are an AI model or which model you run on, do not deny it: say honestly that you are an AI and that you cannot share more detail about the model behind the app.';
    if(s.instr&&s.instr.trim())r+='\n\nThe person wrote this about themselves and how they want you to reply:\n'+s.instr.trim().slice(0,1500);
    if(s.memoryOn&&S.memories.length)r+='\n\nThings the person asked you to remember:\n'+S.memories.slice(0,40).map(function(m){return '- '+m.t}).join('\n');
    var p=c&&c.projectId?projById(c.projectId):null;
    if(p&&p.instr&&p.instr.trim())r+='\n\nThis chat belongs to the project "'+p.name+'". Project instructions:\n'+p.instr.trim().slice(0,2000);
    return r+'\n\nThe conversation follows.';
  }
  function imgPrompt(p){return 'Draw an original illustration for this request: "'+p+'".\nReply with exactly one SVG element and nothing else: no markdown fence, no explanation. Use viewBox="0 0 800 600", a clear composition with layered flat shapes (gradients are fine) and a considered colour palette. No scripts, no external images or fonts, and no text unless the request asks for it. Do not copy any existing character, logo or artwork.'}
  var ERR={not_granted:'Ahmise needs your permission to use Claude. Reload the page and tap Allow when asked.',sampling_disabled:'Claude is not available for this account.',rate_limited:'You have reached your usage limit for now. Wait a while, then tap Try again.',session_expired:'Your session ended. Sign in again and retry.',refused:'Claude could not help with that one. Try asking in a different way.',empty_completion:'No answer came back. Try rephrasing.',prompt_too_large:'This chat got too long. Start a new chat.',unavailable:'Replies only work when you open the Ahmise link in Claude. This saved copy cannot reply.',nokey:'Images and videos need an extra key on the server. See the README.',blocked:'That request was blocked by the safety filter. Try different words.',badimg:'The drawing did not come out. Try describing it differently.',upstream_error:'The connection dropped. Tap Try again.'};

  function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on')},2400)}
  function closePop(){$('pop').hidden=true;S.confirm='';var pm=$('pm');if(pm)pm.hidden=true}

  /* markdown (escape first, then format) */
  function inline(s){return s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g,'$1<em>$2</em>')}
  function block(t){
    var html='',para=[],items=[],kind='';
    function fp(){if(para.length){html+='<p>'+para.join('<br>')+'</p>';para=[]}}
    function fl(){if(items.length){html+='<'+kind+'>'+items.map(function(x){return '<li>'+x+'</li>'}).join('')+'</'+kind+'>';items=[];kind=''}}
    t.split('\n').forEach(function(line){
      var l=line.trim(),m;
      if(!l){fp();fl();return}
      if((m=l.match(/^#{1,4}\s+(.*)$/))){fp();fl();html+='<h4>'+inline(esc(m[1]))+'</h4>';return}
      if((m=l.match(/^[-*•]\s+(.*)$/))){fp();if(kind!=='ul'){fl();kind='ul'}items.push(inline(esc(m[1])));return}
      if((m=l.match(/^\d+[.)]\s+(.*)$/))){fp();if(kind!=='ol'){fl();kind='ol'}items.push(inline(esc(m[1])));return}
      fl();para.push(inline(esc(l)));
    });
    fp();fl();return html;
  }
  function md(src){
    var parts=String(src).split('```'),out='';
    for(var i=0;i<parts.length;i++){
      if(i%2===1){
        var body=parts[i],nl=body.indexOf('\n'),lang='';
        if(nl>-1&&/^[\w+#.-]*$/.test(body.slice(0,nl).trim())){lang=body.slice(0,nl).trim();body=body.slice(nl+1)}
        out+='<div class="code"><div class="ch"><span>'+esc(lang||'code')+'</span><button data-act="copycode">Copy</button></div><pre>'+esc(body.replace(/\n$/,''))+'</pre></div>';
      }else out+=block(parts[i]);
    }
    return out;
  }
  function svgUri(svg){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
  function cleanSvg(t){
    var m=String(t).match(/<svg[\s\S]*<\/svg>/i);if(!m)return '';
    var s=m[0].replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<foreignObject[\s\S]*?<\/foreignObject>/gi,'').replace(/\son\w+\s*=\s*("[^"]*"|'[^']*')/gi,'').replace(/(xlink:)?href\s*=\s*("(?!#)[^"]*"|'(?!#)[^']*')/gi,'');
    if(!/xmlns\s*=/.test(s.slice(0,300)))s=s.replace(/<svg/i,'<svg xmlns="http://www.w3.org/2000/svg"');
    return s;
  }
  function dataUrlToBlob(u){var p=u.split(','),mt=(p[0].match(/:(.*?);/)||[])[1]||'image/jpeg',b=atob(p[1]),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Blob([a],{type:mt})}
  function fmtBytes(n){return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'}

  /* sidebar + top bar */
  function chatRow(c){return '<button class="row" data-open="'+c.id+'"'+(S.cur===c.id&&S.view==='home'?' aria-current="true"':'')+'>'+ic(c.pinned?'pinfill':'chat')+'<span>'+esc(c.title)+'</span></button>'}
  function renderSide(){
    var nav=[['images','Images','images'],['library','Library','library'],['projects','Projects','projects'],['remote','Remote','remote'],['scheduled','Scheduled','scheduled'],['plugins','Plugins','plugins']];
    if(S.installed.Notes)nav.push(['notes','Notes','note']);
    if(S.installed.Calendar)nav.push(['calendar','Calendar','cal']);
    var v=S.view;
    $('nav').innerHTML=nav.map(function(n){var on=v===n[0]||(n[0]==='images'&&v==='create')||(n[0]==='projects'&&v==='project')||(n[0]==='library'&&v==='file');return '<button data-go="'+n[0]+'"'+(on?' aria-current="page"':'')+'>'+ic(n[2])+n[1]+'</button>'}).join('');
    var sorted=S.chats.slice().sort(function(a,b){return b.ts-a.ts});
    var pins=sorted.filter(function(c){return c.pinned}),rec=sorted.filter(function(c){return !c.pinned});
    $('pinned').innerHTML=pins.length?pins.map(chatRow).join(''):'<div class="none">Pin a chat from its menu</div>';
    $('recents').innerHTML=rec.length?rec.slice(0,8).map(chatRow).join('')+(rec.length>8?'<button class="row" data-go="search"><span>See all…</span></button>':''):'<div class="none">Your chats will show up here</div>';
    $('av').textContent=(firstName()||'A')[0].toUpperCase();
  }
  var TITLES={create:'Create an image',search:'Search chats',library:'Library',file:'File',projects:'Projects',project:'Project',export:'Export',remote:'Remote',scheduled:'Scheduled',plugins:'Plugins',notes:'Notes',calendar:'Calendar',settings:'Settings','set-pers':'Personalization','set-mem':'Memory','set-gen':'General','set-usage':'Usage and limits','set-notif':'Notifications','set-priv':'Privacy center','set-model':'Model'};
  function modelLabel(){var m=MODELS.filter(function(x){return x[0]===S.set.model})[0]||MODELS[1];return m[1]}
  function topbar(){
    var v=S.view,t=$('top'),c=curChat();
    var menu='<button class="round menu" data-act="menu" aria-label="Open menu">'+ic('menu')+'</button>';
    if(v==='home'){
      if(c){t.innerHTML=menu+'<div class="title">'+esc(c.title)+'</div><button class="round" data-act="chatmenu" aria-label="Chat options">'+ic('dots')+'</button><button class="round" data-act="newchat" aria-label="New chat">'+ic('chat')+'</button>'}
      else t.innerHTML=menu+'<button class="model-pill" data-act="modelmenu" aria-label="Choose model">'+ic('spark')+modelLabel()+ic('chev')+'</button><span class="spacer"></span><button class="round" data-act="newchat" aria-label="New chat">'+ic('chat')+'</button>';
      return;
    }
    var back=v.indexOf('set-')===0?'settings':v==='file'?'library':v==='project'?'projects':'home';
    var right=v==='projects'?'<button class="round" data-act="newproj" aria-label="New project">'+ic('plus')+'</button>':'<span class="round" style="visibility:hidden"></span>';
    t.innerHTML='<button class="round" data-go="'+back+'" aria-label="Back">'+ic('back')+'</button><div class="title">'+esc(TITLES[v]||'')+'</div>'+right;
  }

  /* chat */
  function msgHTML(m,i,chat){
    if(m.r==='u')return '<div class="bubble me">'+(m.file?'<div class="fchip">'+ic('clip')+'<span>'+esc(m.file)+'</span></div><br>':'')+esc(m.t)+'</div>';
    var last=i===chat.msgs.length-1,acts='',body='';
    if(m.mk){
      var mu=MEDIA[m.mid];
      body=mu?(m.mk==='vid'?'<div class="gen"><video controls playsinline src="'+mu+'"></video></div>':'<div class="gen"><img alt="Generated image" src="'+mu+'"></div>'):'<div class="bubble bot">This '+(m.mk==='vid'?'video':'image')+' is not kept after you close the page. Save it right after it is made, or create it again.</div>';
      acts='<div class="acts">'+(mu?'<button data-act="savemedia" data-a="'+i+'">'+ic('save')+'Save</button>':'')+(last&&!S.busy?'<button data-act="regen">'+ic('redo')+'Try again</button>':'')+'</div>';
    }else if(m.pending&&window.AHMISE_SERVER&&(m.mode==='video'||m.mode==='image')){body='<div class="bubble bot"><span class="typing"><i></i><i></i><i></i></span> '+esc(m.prog||'Working on it')+'</div>'}
    else if(m.pending&&!m.t&&!m.svg&&m.mode!=='image'){body='<div class="bubble bot"><span class="typing" aria-label="Thinking"><i></i><i></i><i></i></span></div>'}
    else if(m.svg){
      body='<div class="gen"><img alt="Generated illustration" src="'+svgUri(m.svg)+'"></div>';
      acts='<div class="acts"><button data-act="savesvg" data-a="'+i+'">'+ic('save')+'Save</button>'+(last&&!S.busy?'<button data-act="regen">'+ic('redo')+'Try again</button>':'')+'</div>';
    }else if(m.pending&&m.mode==='image'){body='<div class="bubble bot"><span class="typing"><i></i><i></i><i></i></span> Drawing your image</div>'}
    else{
      if(m.t)body='<div class="bubble bot'+(m.pending?'" id="live':'')+'">'+md(m.t)+'</div>';
      if(m.err)body+='<div class="bubble err">'+esc(ERR[m.err]||ERR.upstream_error)+'</div>';
      if(!m.pending){
        acts='<div class="acts">'+(m.t?'<button data-act="copy" data-a="'+i+'">'+ic('copy')+'Copy</button>':'')+(last&&!S.busy?'<button data-act="regen">'+ic('redo')+'Try again</button>':'')+'</div>';
      }
    }

  function mErr(code){var e=new Error(code);e.code=code;return e}
  function srvKey(){try{return localStorage.getItem('ahmiseKey')||''}catch(e){return ''}}
  function api(path,opt){opt=opt||{};opt.headers=Object.assign({'x-ahmise-key':srvKey(),'content-type':'application/json'},opt.headers||{});return fetch(path,opt)}
  function jfail(r){return r.json().catch(function(){return {}}).then(function(j){if(r.status===401){try{localStorage.removeItem('ahmiseKey')}catch(e){}}throw mErr(j.code||'upstream_error')})}
  function nap(ms,sig){return new Promise(function(ok,no){var t=setTimeout(ok,ms);sig.addEventListener('abort',function(){clearTimeout(t);no(mErr('cancelled'))})})}
  function videoJob(prompt,m,c,sig){
    var t0=Date.now();
    return api('/api/video/start',{method:'POST',signal:sig,body:JSON.stringify({prompt:prompt})}).then(function(r){if(!r.ok)return jfail(r);return r.json()}).then(function(j){
      function poll(){
        if(Date.now()-t0>9*60000)throw mErr('upstream_error');
        return nap(8000,sig).then(function(){return api('/api/video/status?id='+encodeURIComponent(j.id),{signal:sig})}).then(function(r){if(!r.ok)return jfail(r);return r.json()}).then(function(s){
          if(s.done){if(s.failed)throw mErr('blocked');return}
          m.prog='Making your video… '+Math.round((Date.now()-t0)/1000)+'s. This takes a few minutes.';
          if(S.cur===c.id&&S.view==='home')drawMsgs(true);
          return poll()});
      }
      return poll().then(function(){return api('/api/video/file?id='+encodeURIComponent(j.id),{signal:sig})}).then(function(r){if(!r.ok)return jfail(r);return r.blob()}).then(function(b){return URL.createObjectURL(b)});
    });
  }
  function runMedia(c,m,mode,prompt){

  function addLibFile(f){
    if(usedBytes()>4300000){toast('Storage is nearly full. Delete something first.');return}
    if(/^image\//.test(f.type)){
      var url=URL.createObjectURL(f),im=new Image();
      im.onload=function(){
        var max=900,w=im.width,h=im.height,s=Math.min(1,max/Math.max(w,h)),cv=document.createElement('canvas');
        cv.width=Math.round(w*s);cv.height=Math.round(h*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        URL.revokeObjectURL(url);
        var d=cv.toDataURL('image/jpeg',.8);
        S.files.unshift({id:uid(),name:f.name.replace(/\.\w+$/,'')+'.jpg',kind:'img',data:d,size:d.length,fav:false,ts:Date.now()});
        if(save())toast('Image added');if(S.view==='library')viewLibrary();
      };
      im.onerror=function(){URL.revokeObjectURL(url);toast('Could not open that image')};
      im.src=url;return;
    }
    readTextFile(f,function(t){S.files.unshift({id:uid(),name:f.name,kind:'text',data:t,size:f.size,fav:false,ts:Date.now()});if(save())toast('File added');if(S.view==='library')viewLibrary()});
  }

      pop.className='pop left';
      pop.innerHTML=MODELS.map(function(m){return '<button role="menuitemradio" aria-checked="'+(S.set.model===m[0])+'" data-act="setmodel" data-a="'+m[0]+'"><span>'+m[1]+'<small>'+m[2]+'</small></span></button>'}).join('');
      pop.hidden=false;
    },
    setmodel:function(el,a){S.set.model=a;save();closePop();if(S.view==='home')topbar();else refresh()},
    chatmenu:function(){
      var c=curChat(),pop=$('pop');if(!c)return;
      if(!pop.hidden){closePop();return}
      pop.className='pop';
      pop.innerHTML='<button data-act="pin">'+ic('pin')+'<span>'+(c.pinned?'Unpin':'Pin')+'</span></button><button class="danger" data-act="delchat">'+ic('trash')+'<span>Delete</span></button>';
      pop.hidden=false;S.confirm='';
    },
    pin:function(){var c=curChat();if(c){c.pinned=!c.pinned;save();closePop();renderSide();toast(c.pinned?'Pinned':'Unpinned')}},
    delchat:function(el){
      if(S.confirm!=='del'){S.confirm='del';el.querySelector('span').textContent='Tap again to delete';return}
      var c=curChat();if(c){if(S.busy&&ctl)ctl.abort();markDel([c.id]);S.chats=S.chats.filter(function(x){return x.id!==c.id});S.cur=null;save();S.view='home';render();toast('Chat deleted')}
    },
    sug:function(el,a){S.draft=a;viewHome();var i=$('cin');i.focus();i.setSelectionRange(i.value.length,i.value.length)},
    tile:function(el,a){var t=TILES[+a];S.imgDraft=t[1].charAt(0).toUpperCase()+t[1].slice(1);viewCreate();$('iin').focus()},
    copy:function(el,a){var c=curChat(),m=c&&c.msgs[+a];if(m)copyText(m.t,el)},
    copycode:function(el){copyText(el.closest('.code').querySelector('pre').textContent,el)},
    regen:regen,
    savemedia:function(el,a){var c=curChat(),m=c&&c.msgs[+a],u=m&&MEDIA[m.mid];if(u)fetch(u).then(function(r){return r.blob()}).then(function(b){dlSave(m.mk==='vid'?'ahmise-video.mp4':'ahmise-image.png',b,'Saved')})},
    cmode:function(el,a){S.cmode=a;viewCreate()},
    savesvg:function(el,a){var c=curChat(),m=c&&c.msgs[+a];if(m&&m.svg)dlSave('ahmise-image.svg',m.svg,'Image saved')},
    /* scheduled */
    sw:function(el,a){S.tasks.forEach(function(t){if(t.id===a)t.on=!t.on});save();viewScheduled()},
    delt:function(el,a){S.tasks=S.tasks.filter(function(t){return t.id!==a});save();viewScheduled()},
    runt:function(el,a){var t=S.tasks.filter(function(x){return x.id===a})[0];if(t){S.cur=null;S.proj=null;S.att=null;$('rem').hidden=true;send(t.learn?learnText(t):(t.prompt||t.title),'chat')}},
    lvl:function(el,a){S.lvl=a;var t=$('lt');if(t)S.learnTopic=t.value;viewScheduled()},
    tpl:function(el,a){var tp=TEMPLATES[+a];S.tasks.unshift({id:uid(),icon:tp[0],title:tp[1],when:tp[3],prompt:tp[2],days:tp[4],time:tp[5],on:true});save();viewScheduled();toast('Added. Set the time you want.')},
    rsignout:function(){S.remote=null;save();viewRemote()},
    remrun:function(){var id=$('rem').dataset.id;ACT.runt(null,id)},
    remx:function(){$('rem').hidden=true},
    /* plugins */
    plug:function(el,a){S.installed[a]=!S.installed[a];save();renderSide();if(!S.installed[a]&&(S.view==='notes'&&a==='Notes'||S.view==='calendar'&&a==='Calendar')){go('plugins');return}viewPlugins();toast(S.installed[a]?a+' added':a+' removed')},
    lockplug:function(){toast('This needs an account connection, which is not built yet')},
    openplug:function(el,a){go(a==='Notes'?'notes':'calendar')},
    delnote:function(el,a){S.notes=S.notes.filter(function(n){return n.id!==a});save();viewNotes()},
    asknote:function(el,a){var n=S.notes.filter(function(x){return x.id===a})[0];if(n){S.cur=null;S.proj=null;S.att=null;S.draft='';S.view='home';render();S.draft='Here is one of my notes:\n\n'+n.t+'\n\nHelp me with this: ';viewHome();var i=$('cin');i.focus();i.setSelectionRange(i.value.length,i.value.length);grow(i)}},
    /* projects */
    newproj:function(){if(S.view!=='projects')go('projects');projForm()},
    openproj:function(el,a){S.pid=a;go('project')},
    delproj:function(el,a){
      if(S.confirm!=='proj'){S.confirm='proj';viewProject();return}
      S.projects=S.projects.filter(function(p){return p.id!==a});S.chats.forEach(function(c){if(c.projectId===a)c.projectId=null});save();S.confirm='';go('projects');toast('Project deleted');
    },
    projchat:function(el,a){S.cur=null;S.proj=a;S.draft='';S.att=null;S.view='home';render();var n=$('cin');if(n&&innerWidth>820)n.focus()},
    /* library */
    ltab:function(el,a){S.libTab=a;viewLibrary()},
    addfile:function(){var l=$('lin');if(l)l.click()},
    viewfile:function(el,a){S.fid=a;go('file')},
    fav:function(el,a){var f=fileById(a);if(f){f.fav=!f.fav;save();refresh()}},
    delfile:function(el,a){
      if(S.confirm!=='file'){S.confirm='file';viewFile();return}
      S.files=S.files.filter(function(f){return f.id!==a});save();S.confirm='';go('library');toast('Deleted');
    },
    askfile:function(el,a){var f=fileById(a);if(f){S.cur=null;S.proj=null;S.att={name:f.name,text:f.data.slice(0,20000)};S.draft='';S.view='home';render();toast('Attached. Ask your question.');var i=$('cin');if(i)i.focus()}},
    dlfile:function(el,a){var f=fileById(a);if(f)dlSave(f.name,f.kind==='img'?dataUrlToBlob(f.data):f.data,'File saved')},
    /* export */
    expcopy:function(el,a){var c=S.chats.filter(function(x){return x.id===a})[0];if(c)copyText(chatMarkdown(c),el)},
    expmd:function(el,a){var c=S.chats.filter(function(x){return x.id===a})[0];if(c)dlSave((c.title.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-')||'chat')+'.md',chatMarkdown(c),'Chat saved')},
    exportjson:function(){dlSave('ahmise-export.json',stateJSON(),'Export saved')},
    /* settings */
    acc:function(el,a){S.accent=a;save();applyPrefs();viewSettings()},
    theme:function(){S.theme=S.theme===''?'dark':S.theme==='dark'?'light':'';save();applyPrefs();viewSettings()},
    tog:function(el,a){S.set[a]=!S.set[a];save();if(a==='chime'&&S.set.chime)chime();refresh()},
    seg:function(el,a){var p=a.split(':');S.set[p[0]]=p[1];save();applyPrefs();refresh()},
    delmem:function(el,a){S.memories=S.memories.filter(function(m){return m.id!==a});save();viewMem()},
    clearmem:function(){if(S.confirm!=='mem'){S.confirm='mem';refresh();return}S.memories=[];S.confirm='';save();refresh();toast('Memory cleared')},
    clearfiles:function(){if(S.confirm!=='files'){S.confirm='files';refresh();return}S.files=[];S.confirm='';save();refresh();toast('Library files deleted')},
    clearall:function(){if(S.confirm!=='clear'){S.confirm='clear';refresh();return}if(S.busy&&ctl)ctl.abort();markDel(S.chats.map(function(x){return x.id}));S.chats=[];S.cur=null;S.confirm='';save();renderSide();refresh();toast('All chats deleted')}
  };

  document.addEventListener('click',function(e){
    var pop=$('pop'),pm=$('pm');
    if(!pop.hidden&&!e.target.closest('#pop')&&!e.target.closest('[data-act="chatmenu"],[data-act="modelmenu"]'))closePop();
    if(pm&&!pm.hidden&&!e.target.closest('#pm')&&!e.target.closest('[data-act="plusmenu"]'))pm.hidden=true;
    var el=e.target.closest('[data-act],[data-go],[data-open]');
    if(!el)return;
    var d=el.dataset;
    if(d.go){go(d.go);return}
    if(d.open){openChat(d.open);return}
    var f=ACT[d.act];if(f)f(el,d.a,e);
  });
  document.addEventListener('change',function(e){
    var t=e.target;
    if(t.dataset&&t.dataset.time){S.tasks.forEach(function(x){if(x.id===t.dataset.time){x.time=t.value||'09:00';x.last=''}});save()}
  });

  /* cloud sync of chats and preferences (private per-viewer, needs Claude) */
  function prefSigFn(){return JSON.stringify([S.accent,S.name,S.theme,S.set,S.memories,S.notes,S.tasks,S.projects,S.installed])}
  function prefsObj(){return {accent:S.accent,name:S.name,theme:S.theme,set:S.set,memories:S.memories,notes:S.notes,tasks:S.tasks,projects:S.projects,installed:S.installed,updated:S.pu||0}}
  function pcol(){return DBH.collection('data/users/'+UID)}
  function chatSig(c){var l=c.msgs[c.msgs.length-1];return c.msgs.length+'|'+c.title+'|'+(c.pinned?1:0)+'|'+(l?(l.t||'').length:0)}
  function chatBody(c){var o=JSON.parse(JSON.stringify(c));o.msgs.forEach(function(m){if(m.svg&&m.svg.length>40000)m.svg=''});while(JSON.stringify(o).length>200000&&o.msgs.length>2)o.msgs.shift();return o}
  function unionBy(a,b){var seen={},out=[];(a||[]).concat(b||[]).forEach(function(x){if(x&&x.id&&!seen[x.id]){seen[x.id]=1;out.push(x)}});return out}
  function privText(){return DBH?'Your chats, notes, memory and settings are saved in this browser and, so they follow you to your other devices, in a private space only you can open in Claude. Library files stay on this device. When you send a message, its text goes to Claude to write the reply.':'Your chats, notes, memory and files are stored in this browser on this device. When you send a message, its text goes to Claude to write the reply. Nothing else leaves this page.'}
  function pushSoon(){if(!DBH)return;clearTimeout(flushT);flushT=setTimeout(flush,1500)}
  function markDel(ids){ids.forEach(function(i){if(deletedQ.indexOf(i)<0)deletedQ.push(i);delete synced[i]});pushSoon()}
  function flush(){
    if(!DBH||flushing){if(DBH)pushSoon();return}
    flushing=true;
    var jobs=[],col=pcol();
    S.chats.slice(0,60).forEach(function(c){var sg=chatSig(c);if(synced[c.id]!==sg){c.upd=Date.now();jobs.push(function(){return col.doc('chat_'+c.id).set(chatBody(c)).then(function(){synced[c.id]=sg})})}});
    var q=deletedQ.splice(0);q.forEach(function(id){jobs.push(function(){return col.doc('chat_'+id).delete().catch(function(){})})});
    var ps=prefSigFn();if(ps!==prefSigSynced)jobs.push(function(){return col.doc('prefs').set(prefsObj()).then(function(){prefSigSynced=ps})});
    var p=Promise.resolve();jobs.forEach(function(j){p=p.then(j)});
    p.catch(function(){}).then(function(){flushing=false;try{localStorage.setItem('ahmise2',stateJSON())}catch(e){}});
  }
  function syncInit(){
    Promise.resolve().then(function(){return window.claude?Promise.all([window.claude.use('db'),window.claude.use('user')]):[null,null]}).then(function(r){
      var db=r[0],u=r[1];if(!db||!u)return;
      return u.id().then(function(id){
        if(!id)return;DBH=db;UID=id;
        return pcol().get().then(function(snap){
          var changed=false;
          snap.docs.forEach(function(d){
            var x=d.data()||{},k=d.id;
            if(k==='prefs'){
              S.memories=unionBy(S.memories,x.memories);S.notes=unionBy(S.notes,x.notes);S.tasks=unionBy(S.tasks,x.tasks);S.projects=unionBy(S.projects,x.projects);
              if((x.updated||0)>(S.pu||0)){['accent','name','theme','set','installed'].forEach(function(f){if(x[f]!=null)S[f]=x[f]});S.set=Object.assign({},DEF,S.set);S.pu=x.updated}
              changed=true;
            }else if(k.indexOf('chat_')===0&&x.id&&x.msgs){
              var mine=null;for(var i=0;i<S.chats.length;i++)if(S.chats[i].id===x.id)mine=S.chats[i];
              if(!mine){S.chats.push(x);synced[x.id]=chatSig(x);changed=true}
              else if(chatSig(mine)===chatSig(x))synced[x.id]=chatSig(x);
              else if((x.upd||x.ts||0)>(mine.upd||mine.ts||0)){S.chats[S.chats.indexOf(mine)]=x;synced[x.id]=chatSig(x);changed=true}
            }
          });
          S.chats.sort(function(a,b){return (b.pinned?1:0)-(a.pinned?1:0)||((b.upd||b.ts||0)-(a.upd||a.ts||0))});
          S.chats=S.chats.slice(0,60);
          if(changed){applyPrefs();renderSide();if(S.view==='home'&&!S.busy&&!(S.draft||'').length&&!S.cur)render()}
          lastPrefSig=prefSigFn();prefSigSynced='';
          save();
        });
      });
    }).catch(function(){DBH=null});
  }
  function copyText(t,btn){
    function ok(){var o=btn.innerHTML;btn.textContent='Copied';setTimeout(function(){btn.innerHTML=o},1400)}
    function fallback(){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(e){toast('Select the text and copy it')}ta.remove()}
    try{navigator.clipboard.writeText(t).then(ok,fallback)}catch(e){fallback()}
  }
  $('scrim').addEventListener('click',function(){document.body.classList.remove('open')});
  applyPrefs();render();syncInit();
  setTimeout(checkRem,2500);setInterval(checkRem,30000);
})();
</script>
